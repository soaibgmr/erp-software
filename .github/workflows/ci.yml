name: CI/CD

# Every PR and every push to main or dev runs the checks.
# A push that passes the checks then deploys, API first, then UI:
#   main → GitHub environment "production": migrate the live Supabase database, then `vercel deploy --prod`.
#   dev  → GitHub environment "staging":    migrate the staging Supabase database, then a Vercel *preview*
#          deploy (Preview-scoped env vars = staging settings), aliased to the fixed staging URLs
#          https://erp-software-api-staging.vercel.app and https://erp-software-ui-staging.vercel.app.
# Each GitHub environment holds its own DIRECT_URL, so dev can never migrate the live database.
# Vercel's own Git auto-deploy is switched off for every branch in api/vercel.json and ui/vercel.json,
# so every deployment comes from CI and the schema is always migrated before the new API goes live.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Builds packages/shared first, then typechecks api and ui.
      - run: npm run typecheck
      - run: npm run lint
      # Tests use in-memory fakes and api/vitest.config.mts env; no database needed.
      - run: npm test
      - run: npm run build

  migrate:
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}-migrate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Direct (non-pooled, port 5432) Supabase connection; prisma.config.ts reads DIRECT_URL
      # from the job's GitHub environment (live for main, staging for dev).
      - name: Apply migrations
        working-directory: api
        env:
          APP_ENV: live
          NODE_ENV: production
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}-deploy-${{ matrix.app }}
      cancel-in-progress: false
    strategy:
      # API first, then UI, so the UI never calls an API that is older than it.
      max-parallel: 1
      matrix:
        include:
          - app: api
            project_secret: VERCEL_PROJECT_ID_API
            staging_alias: erp-software-api-staging.vercel.app
          - app: ui
            project_secret: VERCEL_PROJECT_ID_UI
            staging_alias: erp-software-ui-staging.vercel.app
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global vercel@latest
      # Run from the repo root: the Vercel project's Root Directory (api/ or ui/) picks the app,
      # and Vercel builds it remotely with the settings in <app>/vercel.json, same as before.
      - name: Deploy ${{ matrix.app }} to production
        if: github.ref == 'refs/heads/main'
        run: vercel deploy --prod --yes --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
      # Preview deploy (uses the project's Preview env vars = staging), then point the fixed staging URL at it.
      - name: Deploy ${{ matrix.app }} to staging
        if: github.ref == 'refs/heads/dev'
        run: |
          url=$(vercel deploy --yes --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed $url"
          vercel alias set "$url" ${{ matrix.staging_alias }} --token=${{ secrets.VERCEL_TOKEN }}
